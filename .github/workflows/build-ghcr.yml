name: build-ghcr

# 推送到 main 分支自动构建并发布到 GHCR
# 产物：ghcr.io/desstg/jsherp-backend:latest  和  ghcr.io/desstg/jsherp-frontend:latest
#
# 触发方式：
#   1) push 到 main（改了源码或 Dockerfile）
#   2) Actions 页面手动 Run workflow（可指定架构）

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台（群晖 x86 填 linux/amd64；ARM 机型填 linux/arm64；双架构填 linux/amd64,linux/arm64）'
        required: false
        default: 'linux/amd64'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: desstg

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        run: echo "platforms=${{ github.event.inputs.platforms || 'linux/amd64' }}" >> $GITHUB_OUTPUT

  backend:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: ${{ needs.meta.outputs.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jsherp-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jsherp-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=jshERP backend
            org.opencontainers.image.description=jshERP 进销存后端（SpringBoot + JDK8）
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: ${{ needs.meta.outputs.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jsherp-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jsherp-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=jshERP frontend
            org.opencontainers.image.description=jshERP 进销存前端（Vue2 + nginx）
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
