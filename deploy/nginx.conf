# jshERP 前端 nginx 配置
# 前端 axios 基址是相对路径 '/jshERP-boot'（见 src/utils/request.js），
# 所以只要同域反代 /jshERP-boot 到后端，前端代码零修改。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 50m;

    # 前端 SPA：history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 后端 API 反向代理
    location /jshERP-boot/ {
        proxy_pass         http://backend:9999/jshERP-boot/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 报表导出 / 大批量导入可能很慢
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # gzip（前端构建已产出 .gz，这里再兜一层动态压缩）
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;
    gzip_static       on;
}
